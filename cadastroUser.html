<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="icon" href="img/Logo png.png">
</head>

<body>
    <form method="post">
        <h1>Cadastre-se aqui</h1>
        <p>Preencha os dados de cadastro para acessar</p>
        <label>Nome de usuário:</label><br>
        <input type="text" id="nome" name="nome" placeholder="Digite o nome do usuário"><br>
        <label>E-mail:</label><br>
        <input type="email" id="email" name="email" placeholder="Digite seu email"><br>
        <label>Senha:</label><br>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha"><br>
        <input type="submit" name="cadastro" id="cadastro" value="Cadastrar">
    </form>
    <h1>Cadastre-se em nosso site e fure fila<h1>
</body>

</html>
