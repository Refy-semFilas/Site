<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>
    <link rel="icon" href="img/Logo png.png">
    <link rel="stylesheet" href="src/styles/mainHeader.css">
    <link rel="stylesheet" href="src/styles/categoryFilter.css">
    <style>
        .carrinho-vazio {
            text-align: center;
            padding: 60px 20px;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .icone-vazio {
            margin-bottom: 20px;
            opacity: 0.7;
        }
        
        .carrinho-vazio h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .carrinho-vazio p {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }
        
        .btn-voltar {
            display: inline-block;
            background-color: #ff6200;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .btn-voltar:hover {
            background-color: #e55500;
            transform: translateY(-2px);
        }

        .spinner-small {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        .button {
            min-width: 150px;
        }


        .pix-modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            max-width: 400px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .pix-modal-header h2 {
            margin: 10px 0 5px;
            color: #333;
        }
        .pix-modal-header p {
            color: #666;
            font-size: 14px;
            margin: 0 0 20px;
        }
        .pix-qr-item {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #e0e0e0;
        }
        .pix-qr-vendedor {
            font-weight: bold;
            font-size: 16px;
            color: #333;
            margin-bottom: 12px;
        }
        .pix-qr-img {
            width: 200px;
            height: 200px;
            border-radius: 8px;
            background: #fff;
            padding: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .pix-qr-valor {
            font-size: 18px;
            color: #28a745;
            font-weight: bold;
            margin-top: 12px;
        }
        .pix-qr-copiaypega {
            margin-top: 12px;
        }
        .pix-qr-copiaypega code {
            display: inline-block;
            background: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            word-break: break-all;
            cursor: pointer;
            border: 1px dashed #ccc;
            color: #333;
            max-width: 100%;
        }
        .pix-qr-copiaypega code:hover {
            background: #f0f0f0;
            border-color: #ff6200;
        }
        #pixModal .btn-voltar {
            margin-top: 16px;
            width: 100%;
            box-sizing: border-box;
        }
        .pix-qr-img {
            width: 260px;
            height: 260px;
            border-radius: 0;
            background: #fff;
            padding: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .itemCarrinho {
            flex-wrap: wrap;
        }
        .vendedor-tag {
            font-size: 11px;
            color: #888;
            width: 100%;
            order: -1;
            padding: 4px 14px 0;
            box-sizing: border-box;
        }
        .vendedor-tag-nome {
            font-weight: 600;
            color: #666;
        }
        .vendedor-tag-pix {
            color: #999;
            font-family: monospace;
        }
        @media (max-width: 576px) {
            .carrinho-vazio {
                padding: 40px 15px;
            }
            
            .carrinho-vazio h2 {
                font-size: 20px;
            }
            
            .carrinho-vazio p {
                font-size: 14px;
            }
            
            .btn-voltar {
                padding: 10px 25px;
                font-size: 14px;
            }
        }
    </style>

</head>

<body>
    <header>
        <div class="imgEpesquisa">
            <div class="imagemLogo">
                <img class="logo" src="img/Logo png.png" alt="logo">
            </div>
            <div class="pesquisaOpcoes">
                <div class="barraPesquisa">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="11" cy="11" r="6"></circle>
                        <line x1="15.7" y1="15.7" x2="20.2" y2="20.2"></line>
                    </svg>
                    <input type="text" placeholder="Pesquise aqui...">
                </div>
                <div class="opcoes">
                    <a href="home.html">Inicio</a>
                    <a href="desserts.html">Doces</a>
                    <a href="savorySnacks.html">Salgados</a>
                    <a href="beverages.html">Bebidas</a>
                    <a href="shoppingCart.html" aria-label="Ir para o carrinho" style="border-bottom: 1px solid #073c05;">
                        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" style="cursor:pointer;">
                            <path d="M3 3h2l3.6 10.59A2 2 0 0 0 10.5 15h7.88a2 2 0 0 0 1.93-1.5L23 6H6" />
                            <circle cx="10" cy="20" r="1.7" />
                            <circle cx="18" cy="20" r="1.7" />
                        </svg>
                    </a>
                    <a href="src/php/cliente/conta.php" aria-label="Minha conta">
                        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" style="cursor:pointer;">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </a>

                </div>
            </div>
        </div>
    </header>
    <div class="listaCarrinho"></div>
    <div class="footerCarrinho">
        <p class="total">Total: R$ 0,00</p>
        <button class="button">Finalizar</button>
    </div>


    <script>
        const lista = document.querySelector('.listaCarrinho');
        let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
        let vendedoresInfo = {};

        const totalElement = document.querySelector('.total');

        function renderCarrinho() {
            lista.innerHTML = "";

            if (carrinho.length === 0) {
                lista.innerHTML = `
                    <div class="carrinho-vazio">
                        <div class="icone-vazio">
                            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#ff6200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 3h2l3.6 10.59A2 2 0 0 0 10.5 15h7.88a2 2 0 0 0 1.93-1.5L23 6H6" />
                                <circle cx="10" cy="20" r="1.7" />
                                <circle cx="18" cy="20" r="1.7" />
                            </svg>
                        </div>
                        <h2>Seu carrinho está vazio</h2>
                        <p>Adicione produtos deliciosos ao seu carrinho!</p>
                        <a href="home.html" class="btn-voltar">Continuar Comprando</a>
                    </div>
                `;
                return;
            }

            let totalGeral = 0;

            carrinho.forEach(produto => {
                const vInfo = produto.usuario_id ? vendedoresInfo[produto.usuario_id] : null;
                const nomeVendedor = vInfo ? vInfo.username : '';
                const chavePix = vInfo ? (vInfo.chave_pix || '') : '';

                totalGeral += produto.preco * produto.quantidade;

                lista.innerHTML += `
                    <div class="global">    
                        <div class="itemCarrinho">
                            ${nomeVendedor ? '<div class="vendedor-tag"><span class="vendedor-tag-nome">' + nomeVendedor + '</span>' + (chavePix ? ' <span class="vendedor-tag-pix">PIX: ' + chavePix + '</span>' : '') + '</div>' : ''}
                            <img src="${produto.imagem}">
                            <div class="nomePreco">
                                <p class="nome">${produto.nome}</p>
                                <p class="preco">R$ ${parseFloat(produto.preco).toFixed(2).replace('.', ',')}</p>
                            </div>
                            <div class="quantidade" data-id="${produto.id}">
                                <button class="btn remover" aria-label="Remover item">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#a6a6a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="3 6 5 6 21 6" />
                                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                                        <path d="M10 11v6" /><path d="M14 11v6" />
                                        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                                    </svg>
                                </button>
                                <span class="qtd">${produto.quantidade}</span>
                                <button style="color: #a6a6a6;" class="btn adicionar">+</button>
                            </div>
                        </div>
                    </div>`;
            });

            totalElement.innerText = `Total: R$ ${totalGeral.toFixed(2).replace('.', ',')}`;
            ativarBotoes();
        }

        function ativarBotoes() {
            document.querySelectorAll('.adicionar').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.parentElement.dataset.id;
                    const produto = carrinho.find(p => p.id == id);
                    if (produto.quantidade >= produto.estoque) {
                        showAlert('Quantidade máxima em estoque atingida!', 'warning');
                        return;
                    }
                    produto.quantidade++;
                    salvar();
                });
            });

            document.querySelectorAll('.remover').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.parentElement.dataset.id;
                    const index = carrinho.findIndex(p => p.id == id);

                    if (carrinho[index].quantidade > 1) {
                        carrinho[index].quantidade--;
                    } else {
                        carrinho.splice(index, 1);
                    }
                    salvar();
                });
            });
        }

        async function carregarVendedores() {
            const ids = [...new Set(carrinho.map(p => p.usuario_id).filter(Boolean))];
            if (ids.length === 0) return;

            try {
                const response = await fetch('src/php/getPixKeys.php?ids=' + ids.join(','));
                const vendedores = await response.json();
                vendedores.forEach(v => {
                    vendedoresInfo[v.id] = v;
                });
            } catch (error) {}
        }

        function salvar() {
            localStorage.setItem('carrinho', JSON.stringify(carrinho));
            renderCarrinho();
            carregarVendedores().then(renderCarrinho);
        }

        renderCarrinho();
        carregarVendedores().then(renderCarrinho);

        document.querySelector('.button').addEventListener('click', async function() {
            if (carrinho.length === 0) {
                showAlert('Seu carrinho está vazio!', 'warning');
                return;
            }

            const btn = this;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-small"></span> Gerando...';

            try {
                const response = await fetch('src/php/criarPagamentoMP.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ itens: carrinho })
                });

                const result = await response.json();

                if (result.success) {
                    btn.disabled = false;
                    btn.innerHTML = 'Finalizar';
                    mostrarPixQRCodeMP(result.pix, result.venda_id);
                } else {
                    showAlert(result.message, 'error');
                    btn.disabled = false;
                    btn.innerHTML = 'Finalizar';
                }
            } catch (error) {
                showAlert('Erro ao processar compra. Tente novamente.', 'error');
                btn.disabled = false;
                btn.innerHTML = 'Finalizar';
            }
        });
    </script>

    <div id="pixModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:10000;">
        <div class="pix-modal-content">
            <div class="pix-modal-header">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ff6200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="M8 12h8"/><path d="M12 8v8"/>
                </svg>
                <h2>Pagamento via PIX</h2>
                <p>Escaneie o QR Code abaixo para pagar</p>
            </div>
            <div id="pixQrContainer"></div>
            <div id="pixStatusPolling" style="margin-top:16px;padding:12px;background:#fff3cd;border-radius:8px;display:none;">
                <span class="spinner-small" style="border-color:rgba(255,152,0,0.3);border-top-color:#ff9800;"></span>
                <span style="color:#856404;font-size:14px;" id="pixStatusText">Aguardando pagamento...</span>
            </div>
            <div id="pixAprovado" style="margin-top:16px;padding:12px;background:#d4edda;border-radius:8px;display:none;">
                <span style="color:#155724;font-size:14px;font-weight:bold;">Pagamento confirmado!</span>
            </div>
            <div style="display:flex;gap:10px;margin-top:16px;">
                <button class="btn-voltar" style="flex:1;" onclick="fecharPixModal()">Cancelar</button>
                <button class="btn-voltar" style="flex:1;background:#28a745;display:none;" id="btnConfirmarPagamento" onclick="confirmarPagamentoManual()">Já paguei</button>
            </div>
        </div>
    </div>

    <script>
    function showAlert(message, type = 'info') {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.className = 'toast' + (type !== 'info' ? ' ' + type : '');
        toast.textContent = message;
        document.body.appendChild(toast);

        setTimeout(() => toast.remove(), 3000);
    }

    let pollingInterval = null;
    let vendaIdAtual = null;

    function mostrarPixQRCodeMP(pixData, vendaId) {
        vendaIdAtual = vendaId;
        const modal = document.getElementById('pixModal');
        const container = document.getElementById('pixQrContainer');
        container.innerHTML = '';

        document.getElementById('pixStatusPolling').style.display = 'none';
        document.getElementById('pixAprovado').style.display = 'none';
        document.getElementById('btnConfirmarPagamento').style.display = 'none';

        if (!pixData || pixData.length === 0) {
            container.innerHTML = '<p style="text-align:center;color:#666;padding:20px;">Nenhum pagamento disponível.</p>';
            modal.style.display = 'flex';
            return;
        }

        const paymentIds = [];
        let temManual = false;

        pixData.forEach(p => {
            if (p.mode === 'manual') {
                temManual = true;
            } else {
                paymentIds.push(p.mp_payment_id);
            }

            const div = document.createElement('div');
            div.className = 'pix-qr-item';

            const vendedorDiv = document.createElement('div');
            vendedorDiv.className = 'pix-qr-vendedor';
            vendedorDiv.textContent = p.vendedor;
            div.appendChild(vendedorDiv);

            if (p.qr_code_base64) {
                const qrWrapper = document.createElement('div');
                qrWrapper.style.textAlign = 'center';
                const img = document.createElement('img');
                img.className = 'pix-qr-img';
                img.src = 'data:image/png;base64,' + p.qr_code_base64;
                img.alt = 'QR Code PIX';
                qrWrapper.appendChild(img);
                div.appendChild(qrWrapper);
            }

            if (!p.qr_code_base64 && !p.qr_code) {
                const noPix = document.createElement('p');
                noPix.style.cssText = 'color:#999;';
                noPix.textContent = p.vendedor + ': sem chave PIX configurada';
                div.appendChild(noPix);
            }

            if (p.valor > 0) {
                const valorDiv = document.createElement('div');
                valorDiv.className = 'pix-qr-valor';
                valorDiv.textContent = 'Valor: R$ ' + p.valor.toFixed(2).replace('.', ',');
                div.appendChild(valorDiv);
            }

            if (p.qr_code) {
                const copiaDiv = document.createElement('div');
                copiaDiv.className = 'pix-qr-copiaypega';
                copiaDiv.innerHTML = '<small>Ou copie o código:</small><br>';
                const codeEl = document.createElement('code');
                codeEl.textContent = p.qr_code;
                codeEl.onclick = function() { copiarBrcode(this); };
                copiaDiv.appendChild(codeEl);
                div.appendChild(copiaDiv);
            }

            container.appendChild(div);
        });

        modal.style.display = 'flex';

        if (paymentIds.length > 0) {
            document.getElementById('pixStatusPolling').style.display = 'block';
            iniciarPolling(paymentIds);
        }

        if (temManual) {
            document.getElementById('btnConfirmarPagamento').style.display = 'block';
        }
    }

    function iniciarPolling(paymentIds) {
        if (pollingInterval) clearInterval(pollingInterval);

        pollingInterval = setInterval(async () => {
            try {
                const response = await fetch('src/php/verificarPagamento.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ payment_ids: paymentIds })
                });

                const result = await response.json();

                if (result.success && result.all_approved) {
                    clearInterval(pollingInterval);
                    pollingInterval = null;

                    document.getElementById('pixStatusPolling').style.display = 'none';
                    document.getElementById('pixAprovado').style.display = 'block';
                    document.getElementById('btnConfirmarPagamento').style.display = 'none';

                    localStorage.removeItem('carrinho');
                    showAlert('Pagamento confirmado! Pedido registrado com sucesso.', 'success');
                    setTimeout(() => { window.location.href = 'home.html'; }, 3000);
                } else if (result.success) {
                    const pendentes = result.payments.filter(p => p.status === 'approved').length;
                    const total = result.payments.length;
                    document.getElementById('pixStatusText').textContent =
                        'Aguardando pagamento... (' + pendentes + '/' + total + ' confirmados)';
                }
            } catch (error) {}
        }, 5000);
    }

    async function confirmarPagamentoManual() {
        const btn = document.getElementById('btnConfirmarPagamento');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-small"></span> Confirmando...';

        try {
            const response = await fetch('src/php/finalizarCompra.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ itens: carrinho, action: 'confirmar' })
            });

            const result = await response.json();

            if (result.success) {
                if (pollingInterval) {
                    clearInterval(pollingInterval);
                    pollingInterval = null;
                }
                document.getElementById('pixStatusPolling').style.display = 'none';
                document.getElementById('pixAprovado').style.display = 'block';
                document.getElementById('btnConfirmarPagamento').style.display = 'none';

                localStorage.removeItem('carrinho');
                showAlert('Pagamento confirmado! Pedido registrado com sucesso.', 'success');
                setTimeout(() => { window.location.href = 'home.html'; }, 3000);
            } else {
                showAlert(result.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Já paguei';
            }
        } catch (error) {
            showAlert('Erro ao confirmar pagamento.', 'error');
            btn.disabled = false;
            btn.textContent = 'Já paguei';
        }
    }

    function fecharPixModal() {
        if (pollingInterval) {
            clearInterval(pollingInterval);
            pollingInterval = null;
        }
        document.getElementById('pixModal').style.display = 'none';
    }

    function copiarBrcode(el) {
        navigator.clipboard.writeText(el.textContent).then(() => {
            showAlert('Código copiado!', 'success');
        }).catch(() => {
            const range = document.createRange();
            range.selectNode(el);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand('copy');
            showAlert('Código copiado!', 'success');
        });
    }
    </script>

</body>

</html>
