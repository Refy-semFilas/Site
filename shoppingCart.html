<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>
    <link rel="icon" href="img/Logo png.png">
    <link rel="stylesheet" href="src/styles/mainHeader.css">
    <link rel="stylesheet" href="src/styles/categoryFilter.css">
    <style>
        .carrinho-vazio {
            text-align: center;
            padding: 80px 20px;
            max-width: 420px;
            margin: 0 auto;
        }
        
        .icone-vazio {
            margin-bottom: 24px;
        }
        
        .icone-vazio svg {
            opacity: 0.6;
        }
        
        .carrinho-vazio h2 {
            color: #2d2d2d;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .carrinho-vazio p {
            color: #999;
            font-size: 16px;
            margin-bottom: 32px;
        }
        
        .btn-voltar {
            display: inline-block;
            background: linear-gradient(135deg, #ff6200 0%, #ff8533 100%);
            color: white;
            padding: 14px 36px;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 4px 14px rgba(255, 98, 0, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .btn-voltar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 98, 0, 0.4);
        }

        .itemCarrinho {
            flex-wrap: wrap;
            padding: 12px 20px;
        }
        .listaCarrinho {
            max-width: 800px;
            margin: 24px auto;
            padding: 0 20px;
        }
        @media (max-width: 576px) {
            .carrinho-vazio {
                padding: 40px 15px;
            }
            
            .carrinho-vazio h2 {
                font-size: 20px;
            }
            
            .carrinho-vazio p {
                font-size: 14px;
            }
            
            .btn-voltar {
                padding: 10px 25px;
                font-size: 14px;
            }
        }
    </style>

</head>

<body>
    <header>
        <div class="imgEpesquisa">
            <div class="imagemLogo">
                <img class="logo" src="img/Logo png.png" alt="logo">
            </div>
            <div class="pesquisaOpcoes">
                <div class="barraPesquisa">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="11" cy="11" r="6"></circle>
                        <line x1="15.7" y1="15.7" x2="20.2" y2="20.2"></line>
                    </svg>
                    <input type="text" placeholder="Pesquise aqui...">
                </div>
                <div class="opcoes">
                    <a href="home.html">Inicio</a>
                    <a href="desserts.html">Doces</a>
                    <a href="savorySnacks.html">Salgados</a>
                    <a href="beverages.html">Bebidas</a>
                    <a href="shoppingCart.html" aria-label="Ir para o carrinho" style="border-bottom: 1px solid #073c05;">
                        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" style="cursor:pointer;">
                            <path d="M3 3h2l3.6 10.59A2 2 0 0 0 10.5 15h7.88a2 2 0 0 0 1.93-1.5L23 6H6" />
                            <circle cx="10" cy="20" r="1.7" />
                            <circle cx="18" cy="20" r="1.7" />
                        </svg>
                    </a>
                    <a href="src/php/cliente/conta.php" aria-label="Minha conta">
                        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" style="cursor:pointer;">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </a>

                </div>
            </div>
        </div>
    </header>
    <div class="listaCarrinho"></div>
    <div class="footerCarrinho">
        <p class="total">Total: R$ 0,00</p>
        <button class="button">Finalizar</button>
    </div>


    <script>
        const lista = document.querySelector('.listaCarrinho');
        let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

        const totalElement = document.querySelector('.total');

        function renderCarrinho() {
            lista.innerHTML = "";

            if (carrinho.length === 0) {
                lista.innerHTML = `
                    <div class="carrinho-vazio">
                        <div class="icone-vazio">
                            <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#ff6200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 3h2l3.6 10.59A2 2 0 0 0 10.5 15h7.88a2 2 0 0 0 1.93-1.5L23 6H6" />
                                <circle cx="10" cy="20" r="1.7" />
                                <circle cx="18" cy="20" r="1.7" />
                            </svg>
                        </div>
                        <h2>Seu carrinho está vazio</h2>
                        <p>Adicione produtos deliciosos ao seu carrinho!</p>
                        <a href="home.html" class="btn-voltar">Continuar Comprando</a>
                    </div>
                `;
                return;
            }

            let totalGeral = 0;

            carrinho.forEach(produto => {
                totalGeral += produto.preco * produto.quantidade;

                lista.innerHTML += `
                    <div class="global">    
                        <div class="itemCarrinho">
                            <img src="${produto.imagem}">
                            <div class="nomePreco">
                                <p class="nome">${produto.nome}</p>
                                <p class="preco">R$ ${parseFloat(produto.preco).toFixed(2).replace('.', ',')}</p>
                            </div>
                            <div class="quantidade" data-id="${produto.id}">
                                <button class="btn remover" aria-label="Remover item">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#a6a6a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="3 6 5 6 21 6" />
                                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                                        <path d="M10 11v6" /><path d="M14 11v6" />
                                        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                                    </svg>
                                </button>
                                <span class="qtd">${produto.quantidade}</span>
                                <button style="color: #a6a6a6;" class="btn adicionar">+</button>
                            </div>
                        </div>
                    </div>`;
            });

            totalElement.innerText = `Total: R$ ${totalGeral.toFixed(2).replace('.', ',')}`;
            ativarBotoes();
        }

        function ativarBotoes() {
            document.querySelectorAll('.adicionar').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.parentElement.dataset.id;
                    const produto = carrinho.find(p => p.id == id);
                    if (produto.quantidade >= produto.estoque) {
                        showAlert('Quantidade máxima em estoque atingida!', 'warning');
                        return;
                    }
                    produto.quantidade++;
                    salvar();
                });
            });

            document.querySelectorAll('.remover').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.parentElement.dataset.id;
                    const index = carrinho.findIndex(p => p.id == id);

                    if (carrinho[index].quantidade > 1) {
                        carrinho[index].quantidade--;
                    } else {
                        carrinho.splice(index, 1);
                    }
                    salvar();
                });
            });
        }

        function salvar() {
            localStorage.setItem('carrinho', JSON.stringify(carrinho));
            renderCarrinho();
        }

        renderCarrinho();

        document.querySelector('.button').addEventListener('click', function() {
            if (carrinho.length === 0) {
                showAlert('Seu carrinho está vazio!', 'warning');
                return;
            }
            mostrarBetaModal();
        });
    </script>

    <div id="betaModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:10000;">
        <div style="background:#fff;border-radius:20px;padding:40px 32px 28px;max-width:360px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);animation:betaIn 0.25s ease;">
            <div style="margin-bottom:16px;">
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#ff6200" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/>
                </svg>
            </div>
            <h2 style="color:#2d2d2d;font-size:22px;margin:0 0 8px;">Beta</h2>
            <p style="color:#999;font-size:15px;margin:0 0 24px;line-height:1.5;">Pagamentos online estarão disponíveis em breve! Fique ligado.</p>
            <button class="btn-voltar" onclick="document.getElementById('betaModal').style.display='none'">OK</button>
        </div>
    </div>

    <script src="toast.js"></script>
    <script>
    function mostrarBetaModal() {
        document.getElementById('betaModal').style.display = 'flex';
    }
    </script>

    <style>
    @keyframes betaIn {
        from { transform: scale(0.85); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }
    </style>

</body>

</html>
