<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro novo usuário</title>
    <link rel="icon" href="img/Logo png.png">
    <link rel="stylesheet" href="src/styles/generalStyles.css">
    <link rel="stylesheet" href="src/styles/loginForms.css">
</head>

<body class="register-page">
    <form action="src/php/registerUser.php" method="POST">

        <div class="container">
            <div class="conteudo">
                <h1 class="titleConteudo">Cadastre-se&nbsp;<span class="titleConteudoColor">aqui</span></h1>
                <p class="textGray">Preencha os dados de login para acessar</p>
                <div class="boxUser">
                    <label class="user">Nome de usuário</label>
                    <div class="inputBox">
                        <input type="text" name="user" id="user" placeholder="Digite seu nome de usuário">
                        <svg class="icon" width="24" height="24" viewBox="0 0 24 24">
                            <path d="M12.0672 2C9.6678 2 7.72266 3.94514 7.72266 6.34459C7.72266 8.74404 
        9.6678 10.6892 12.0672 10.6892C14.4667 10.6892 16.4118 8.74404 
        16.4118 6.34459C16.4118 3.94514 14.4667 2 12.0672 2Z" fill="#a6a6a6" />
                            <path d="M20.25 19.453C20.2421 19.8615 19.9087 20.1895 19.5001 20.1895H4.50013C4.09157 
        20.1895 3.75818 19.8624 3.75027 19.454C3.97867 17.6258 4.22374 16.7262 
        4.73808 15.8194C5.79641 13.9537 7.92408 12.1895 12.0001 12.1895C16.0762 
        12.1895 18.2038 13.9537 19.2622 15.8194C19.7765 16.7262 20.0216 17.6258 
        20.1393 18.2937C20.2456 19.2127 20.2503 19.404 20.25 19.453Z" fill="#a6a6a6" />
                        </svg>
                    </div>
                </div>

                <div class="boxEmail">
                    <label class="email">E-mail</label>
                    <div class="inputBox">
                        <input type="email" name="email" id="email" placeholder="Digite seu e-mail">
                        <svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a6a6a6"
                            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="5" width="18" height="14" rx="3" ry="3"></rect>
                            <path d="M3 7l9 7 9-7"></path>
                        </svg>

                    </div>
                </div>

                <div class="boxSenha">
                    <label class="senha">Senha</label>
                    <div class="inputBox">
                        <input type="password" name="senha" id="senha" placeholder="Digite sua senha">
                        <svg id="svgOlho" class="icon icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="#a6a6a6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                            style="cursor: pointer;">
                            <path d="M2 12s4.5-7 10-7 10 7 10 7-4.5 7-10 7S2 12 2 12z" />
                            <circle cx="12" cy="12" r="3" />
                            <line x1="3" y1="3" x2="21" y2="21" />
                        </svg>
                    </div>
                </div>

                <div class="boxTipo">
                    <label class="tipo">Tipo de conta</label>
                    <div class="inputBox">
                        <select class="seletor" name="tipo" id="tipo" required>
                            <option value="">Selecione o tipo</option>
                            <option value="cliente">Cliente</option>
                            <option value="admin">Vendedor</option>
                        </select>
                    </div>
                </div>

                <button class="button" style="margin-bottom: 7%;" type="submit" id="btnCadastrar">Cadastrar</button>
            </div>
        </div>

        <h1 class="msgLado">Cadastre-se e compre <br>sem fila</h1>
    </form>

    <script>
        const senhaInput = document.getElementById('senha');
        const olho = document.getElementById('svgOlho');
        const emailInput = document.getElementById('email');
        const userInput = document.getElementById('user');
        
        // Função para validar email em tempo real
        function validarEmail(email) {
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return regex.test(email);
        }
        
        // Verificar email quando o usuário sair do campo
        emailInput.addEventListener('blur', async function() {
            const email = this.value.trim();
            
            if (email && validarEmail(email)) {
                try {
                    const response = await fetch('src/php/checkEmail.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ email: email })
                    });
                    
                    const result = await response.json();
                    
                    if (result.exists) {
                        this.setCustomValidity('Este email já está em uso!');
                        this.classList.add('error');
                        // Mostrar mensagem de erro
                        showEmailError('Este email já está cadastrado no sistema!');
                    } else {
                        this.setCustomValidity('');
                        this.classList.remove('error');
                        hideEmailError();
                    }
                } catch (error) {
                    console.error('Erro ao verificar email:', error);
                }
            }
        });
        
        // Funções para mostrar/esconder mensagens de erro
        function showEmailError(message) {
            let errorDiv = document.getElementById('email-error');
            if (!errorDiv) {
                errorDiv = document.createElement('div');
                errorDiv.id = 'email-error';
                errorDiv.style.color = '#ff6200';
                errorDiv.style.fontSize = '12px';
                errorDiv.style.marginTop = '5px';
                emailInput.parentNode.parentNode.appendChild(errorDiv);
            }
            errorDiv.textContent = message;
        }
        
        function hideEmailError() {
            const errorDiv = document.getElementById('email-error');
            if (errorDiv) {
                errorDiv.remove();
            }
        }
        
        // Validação e envio do formulário via fetch
        document.querySelector('form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const tipoSelect = document.getElementById('tipo');
            const email = emailInput.value.trim();
            const username = userInput.value.trim();
            
            if (!tipoSelect.value) {
                showAlert('Por favor, selecione o tipo de conta!', 'warning');
                tipoSelect.focus();
                return;
            }
            
            if (!validarEmail(email)) {
                showAlert('Por favor, digite um email válido!', 'error');
                emailInput.focus();
                return;
            }
            
            if (emailInput.setCustomValidity && emailInput.setCustomValidity.toString().includes('em uso')) {
                showAlert('Por favor, use outro email! Este já está cadastrado.', 'error');
                emailInput.focus();
                return;
            }

            const btn = document.getElementById('btnCadastrar');
            btn.disabled = true;
            btn.textContent = 'Cadastrando...';

            try {
                const formData = new FormData(this);
                const response = await fetch('src/php/registerUser.php', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (result.success) {
                    showAlert('Cadastro realizado com sucesso!', 'success');
                    setTimeout(() => {
                        window.location.href = result.redirect;
                    }, 2500);
                } else {
                    showAlert(result.message, 'error');
                    btn.disabled = false;
                    btn.textContent = 'Cadastrar';
                }
            } catch (error) {
                showAlert('Erro de conexão. Tente novamente.', 'error');
                btn.disabled = false;
                btn.textContent = 'Cadastrar';
            }
        });
        
        // Limpar erro quando o usuário começar a digitar novamente
        emailInput.addEventListener('input', function() {
            this.setCustomValidity('');
            this.classList.remove('error');
            hideEmailError();
        });
        
        olho.addEventListener('click', () => {
            if (senhaInput.type === 'password') {
                senhaInput.type = 'text';
            } else {
                senhaInput.type = 'password';
            }
            olho.classList.toggle('active');
        });
    </script>
    
    <script src="toast.js"></script>
    
    <style>
        input.error {
            border-color: #ff6200 !important;
            box-shadow: 0 0 5px rgba(255, 98, 0, 0.3) !important;
        }
    </style>
</body>

</html>
