<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>
    <link rel="icon" href="../img/Logo png.png">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="selecao.css">
</head>

<body>
    <header>
        <div class="imgEpesquisa">
            <div class="imagemLogo">
                <img class="logo" src="../img/Logo png.png" alt="logo">
            </div>
            <div class="pesquisaOpcoes">
                <div class="barraPesquisa">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="11" cy="11" r="6"></circle>
                        <line x1="15.7" y1="15.7" x2="20.2" y2="20.2"></line>
                    </svg>
                    <input type="text" placeholder="Pesquise aqui...">
                </div>
                <div class="opcoes">
                    <a href="inicio.html">Inicio</a>
                    <a href="doces.html">Doces</a>
                    <a href="salgados.html">Salgados</a>
                    <a href="bebidas.html">Bebidas</a>
                    <a href="cadCartao.html">Cadastro cartão</a>
                    <a href="carrinho.html" aria-label="Ir para o carrinho" style="border-bottom: 1px solid #073c05;">
                        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" style="cursor:pointer;">
                            <path d="M3 3h2l3.6 10.59A2 2 0 0 0 10.5 15h7.88a2 2 0 0 0 1.93-1.5L23 6H6" />
                            <circle cx="10" cy="20" r="1.7" />
                            <circle cx="18" cy="20" r="1.7" />
                        </svg>
                    </a>

                </div>
            </div>
        </div>
    </header>
    <div class="listaCarrinho"></div>

    <script>
        const lista = document.querySelector('.listaCarrinho');
        let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

        function renderCarrinho() {
            lista.innerHTML = "";

            if (carrinho.length === 0) {
                lista.innerHTML = "<p>Seu carrinho está vazio</p>";
                return;
            }

            carrinho.forEach(produto => {
                lista.innerHTML += `
            <div class="global">    
                <div class="itemCarrinho">
                    <img src="${produto.imagem}">
                    <div class="nomePreco">
                        <p class="nome">${produto.nome}</p>
                        <p class="preco">R$ ${produto.preco}</p>
                    </div>

                    <div class="quantidade" data-nome="${produto.nome}">
                        <button class="btn remover" aria-label="Remover item">
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="27"
                                height="27"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="#a6a6a6"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <polyline points="3 6 5 6 21 6" />
                                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                                <path d="M10 11v6" />
                                <path d="M14 11v6" />
                                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
                            </svg>
                        </button>


                        <span class="qtd">${produto.quantidade}</span>
                        <button style="color: #a6a6a6;" class="btn adicionar">+</button>
                    </div>
                </div>
            </div>
        `;
            });

            ativarBotoes();
        }

        function ativarBotoes() {
            document.querySelectorAll('.adicionar').forEach(btn => {
                btn.addEventListener('click', () => {
                    const nome = btn.parentElement.dataset.nome;
                    const produto = carrinho.find(p => p.nome === nome);
                    produto.quantidade++;
                    salvar();
                });
            });

            document.querySelectorAll('.remover').forEach(btn => {
                btn.addEventListener('click', () => {
                    const nome = btn.parentElement.dataset.nome;
                    const index = carrinho.findIndex(p => p.nome === nome);

                    if (carrinho[index].quantidade > 1) {
                        carrinho[index].quantidade--;
                    } else {
                        carrinho.splice(index, 1);
                    }
                    salvar();
                });
            });
        }

        function salvar() {
            localStorage.setItem('carrinho', JSON.stringify(carrinho));
            renderCarrinho();
        }

        renderCarrinho();
    </script>


</body>

</html>
