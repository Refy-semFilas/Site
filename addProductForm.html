<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar item</title>
    <link rel="icon" href="img/Logo png.png">
    <link rel="stylesheet" href="src/styles/mainHeader.css">
    <link rel="stylesheet" href="src/styles/addProduct.css">
</head>

<body>
    <header>
        <div class="imgEpesquisa">
            <div class="imagemLogo">
                <img class="logo" src="img/Logo png.png" alt="logo">
            </div>
            <div class="pesquisaOpcoes">
                <div class="opcoes">
                    <a href="src/php/cantineiro/dashboard.php">Inicio</a>
                    <a href="addProductForm.html" style="border-bottom: 1px solid #073c05;">Adicionar item</a>
                    <a href="src/php/cantineiro/configPagamento.php">Pagamento</a>
                    <a href="src/php/cantineiro/conta.php" aria-label="Minha conta">
                        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" style="cursor:pointer;">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="conteudo">
        <form id="form-produto" method="post" action="src/php/cantineiro/addProduct.php" enctype="multipart/form-data">
            <!--o ultimo serve para enviar a imagem-->

            <h1 class="titleConteudo">Adicione seu&nbsp;<span class="titleConteudoColor">produto</span></h1>
            <div class="ladoAlado">
                <div class="coluna nome">
                    <label>Nome do produto</label>
                    <div class="input-with-icon">
                        <input type="text" name="nome" id="nome" placeholder="Digite o nome do produto">
                        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 7l9-4 9 4v10l-9 4-9-4V7z" />
                            <path d="M3 7l9 4 9-4" />
                            <path d="M12 3v18" />
                        </svg>
                    </div>
                </div>

                <div class="coluna descricao">
                    <label>Descrição do produto</label>
                    <div class="input-with-icon">
                        <input type="text" id="descricao" name="descricao" placeholder="Digite a descrição do produto">
                        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <path d="M14 2v6h6" />
                            <path d="M8 12h8" />
                            <path d="M8 16h8" />
                        </svg>
                    </div>
                </div>
            </div>

            <div class="ladoAlado">
                <div class="coluna valor">
                    <label>Valor do produto</label>
                    <div class="input-with-icon">
                        <input type="text" id="valor" name="valor" placeholder="R$ 00,00">
                        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 1v22" />
                            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7H15a3.5 3.5 0 0 1 0 7H6" />
                        </svg>
                    </div>
                </div>
                <div class="coluna estoque">
                    <label>Quantidade em estoque</label>
                    <div class="input-with-icon">
                        <input type="number" id="estoque" name="estoque" placeholder="Digite a quantidade" min="0">
                    </div>
                </div>
            </div>

            <div class="ladoAlado">
                <div class="coluna codigo">
                    <label>Código de barras do produto</label>
                    <div class="input-with-icon">
                        <input type="text" id="codigoBarras" name="codigoBarras"
                            placeholder="Digite o código de barras do produto">
                        <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000"
                            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="1" />
                            <path d="M6 8v8" />
                            <path d="M9 6v12" />
                            <path d="M12 8v8" />
                            <path d="M15 6v12" />
                            <path d="M18 8v8" />
                        </svg>
                    </div>
                </div>
                <div class="coluna categoria">
                    <label>Categoria</label>
                    <select class="selection" name="categoria" id="categoria" required>
                        <option value="" disabled selected>Categoria</option>
                        <option value="bebidas">Bebidas</option>
                        <option value="doces">Doces</option>
                        <option value="salgados">Salgados</option>
                    </select>
                </div>
            </div>

            <div class="ladoAlado">
                <div class="coluna img">
                    <label class="add-img-label" for="foto">
                        Add imagem
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                            fill="none" stroke="#666" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" />
                            <circle cx="8.5" cy="8.5" r="1.5" />
                            <path d="M21 15l-5-6-7 8" />
                        </svg>
                    </label>
                    <input type="file" name="foto" id="foto" accept="image/*">
                    <img id="preview" style="display:none; max-width:180px; margin-top:10px; border-radius:8px;">
                </div>
            </div>

            <div class="botoes">
                <button class="btn cancelar">Cancelar</button>
                <button class="btn adicionar">Adicionar</button>
            </div>
        </form>
    </div>


    <script>
        const input = document.getElementById('foto');
        const preview = document.getElementById('preview');

        input.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
                let campos = ["nome", "descricao", "valor", "codigoBarras", "estoque"];
            }
        });

        document.getElementById("form-produto").addEventListener("submit", function (e) {
            let tudoOk = true;

            let campos = ["nome", "descricao", "valor", "codigoBarras"];

            campos.forEach(id => {
                let campo = document.getElementById(id);

                if (!campo.value.trim()) {
                    campo.style.borderBottom = "2px solid red";
                    tudoOk = false;
                } else {
                    campo.style.borderBottom = "2px solid #ccc";
                }
            });

            let foto = document.getElementById("foto");
            if (foto.files.length === 0) {
                foto.style.borderBottom = "2px solid red";
                tudoOk = false;
            } else {
                foto.style.borderBottom = "none";
            }

            if (!tudoOk) {
                e.preventDefault();
            }
        });
    </script>

</body>

</html>
