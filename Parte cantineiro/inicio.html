<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="icon" href="../img/Logo png.png">
    <link rel="stylesheet" href="../Parte do cliente/header.css">
    <link rel="stylesheet" href="cardCantina.css">
</head>

<body>
    <header>
        <div class="imgEpesquisa">
            <div class="imagemLogo">
                <img class="logo" src="../img/Logo png.png" alt="logo">
            </div>
            <div class="pesquisaOpcoes">
                <div class="barraPesquisa">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="11" cy="11" r="6"></circle>
                        <line x1="15.7" y1="15.7" x2="20.2" y2="20.2"></line>
                    </svg>
                    <input type="text" placeholder="Pesquise aqui...">
                </div>
                <div class="opcoes">
                    <a href="addItem.html">Adicionar item</a>
                    <a href="excluiItem.html">Excluir item</a>
                    <a href="alteraItem">alterar item</a>
                    <a href="relatorio.html">Relatório de venda</a>
                </div>
            </div>
        </div>
    </header>

    <div class="conteudo">
        <div class="card">
            <div class="imagem">
                <img src="../img/TortadeFrango.webp" alt="Torta de frango">
            </div>
            <div class="info">
                <div class="descricao">
                    <p>Torta de frango</p>
                </div>
                <div class="preco">
                    <p>R$ 10,00</p>
                </div>
            </div>
        </div>  

        <div class="card">
            <div class="imagem">
                <img src="../img/BolodePote.webp" alt="Torta de frango">
            </div>
            <div class="info">
                <div class="descricao">
                    <p>Bolo de pote de morango</p>
                </div>
                <div class="preco">
                    <p>R$ 10,00</p>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="imagem">
                <img src="../img/CocaCola.webp" alt="Torta de frango">
            </div>
            <div class="info">
                <div class="descricao">
                    <p>Coca cola Star Wars</p>
                </div>
                <div class="preco">
                    <p>R$ 6,00</p>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="imagem">
                <img src="../img/ConeTrufado.webp" alt="Torta de frango">
            </div>
            <div class="info">
                <div class="descricao">
                    <p>Cone trufado de leite ninho</p>
                </div>
                <div class="preco">
                    <p>R$ 9,00</p>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
