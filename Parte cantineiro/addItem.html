<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar item</title>
    <link rel="icon" href="../img/Logo png.png">
    <link rel="stylesheet" href="../Parte do cliente/header.css">
    <link rel="stylesheet" href="newProduto.css">
</head>

<body>
    <header>
        <div class="imgEpesquisa">
            <div class="imagemLogo">
                <img class="logo" src="../img/Logo png.png" alt="logo">
            </div>
            <div class="pesquisaOpcoes">
                <div class="barraPesquisa">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="11" cy="11" r="6"></circle>
                        <line x1="15.7" y1="15.7" x2="20.2" y2="20.2"></line>
                    </svg>
                    <input type="text" placeholder="Pesquise aqui...">
                </div>
                <div class="opcoes">
                    <a href="inicio.html">Inicio</a>
                    <a href="addItem.html">Adicionar item</a>
                    <a href="excluiItem.html">Excluir item</a>
                    <a href="alteraItem">alterar item</a>
                    <a href="relatorio.html">Relatório de venda</a>
                </div>
            </div>
        </div>
    </header>

    <div class="conteudo">
        <form method="post" action="adicionarProduto">
            <h1 class="titleConteudo">Adicione seu&nbsp;<span class="titleConteudoColor">produto</span></h1>
            <label>Nome do produto</label>
            <div class="input-with-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7l9-4 9 4v10l-9 4-9-4V7z" />
                    <path d="M3 7l9 4 9-4" />
                    <path d="M12 3v18" />
                </svg>
                <input type="text" name="nome" id="nome" placeholder="Digite o nome do produto">
            </div>

            <label>Descrição</label>
            <div class="input-with-icon">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-desc" width="22" height="22"
                    viewBox="0 0 24 24" fill="none" stroke="#a6a6a6" stroke-width="1.6" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <path d="M14 2v6h6" />
                    <path d="M8 12h8" />
                    <path d="M8 16h8" />
                </svg>

                <input type="text" name="descricao" id="descricao" placeholder="Digite a descrição do produto">
            </div>

            <label>Valor do produto</label>
            <div class="input-with-icon">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-price" width="22" height="22"
                    viewBox="0 0 24 24" fill="none" stroke="#a6a6a6" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 1v22" />
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7H15a3.5 3.5 0 0 1 0 7H6" />
                </svg>

                <input type="text" name="valor" id="valor" placeholder="00,00">
            </div>

            <label>Código de barras</label>
            <div class="input-with-icon">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-barcode" width="22" height="22"
                    viewBox="0 0 24 24" fill="none" stroke="#a6a6a6" stroke-width="1.6" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <rect x="2" y="4" width="20" height="16" rx="1" />
                    <path d="M6 8v8" />
                    <path d="M9 6v12" />
                    <path d="M12 8v8" />
                    <path d="M15 6v12" />
                    <path d="M18 8v8" />
                </svg>

                <input type="text" name="codigoBarras" id="codigoBarras" placeholder="Digite o código de barras">
            </div>

            <label>Add imagem</label>
            <div class="input-with-icon">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-image" width="22" height="22"
                    viewBox="0 0 24 24" fill="none" stroke="#a6a6a6" stroke-width="1.6" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <circle cx="8.5" cy="8.5" r="1.5" />
                    <path d="M21 15l-5-6-7 8" />
                </svg>

                <input type="file" id="foto" accept="image/*">
            </div>
            <img id="preview" src="#" alt="Pré-visualização da imagem"
                style="display:none; max-width:200px; margin-top:10px;">

            <button>Cancelar</button>
            <button>Adicionar</button>
        </form>
    </div>

    <script>
        const input = document.getElementById('foto');
        const preview = document.getElementById('preview');

        input.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>

</html>
