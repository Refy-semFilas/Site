<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar item</title>
    <link rel="icon" href="../img/Logo png.png">
    <link rel="stylesheet" href="../Parte do cliente/header.css">
    <link rel="stylesheet" href="newProduto.css">
</head>

<body>
    <header>
        <div class="imgEpesquisa">
            <div class="imagemLogo">
                <img class="logo" src="../img/Logo png.png" alt="logo">
            </div>
            <div class="pesquisaOpcoes">
                <div class="barraPesquisa">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="11" cy="11" r="6"></circle>
                        <line x1="15.7" y1="15.7" x2="20.2" y2="20.2"></line>
                    </svg>
                    <input type="text" placeholder="Pesquise aqui...">
                </div>
                <div class="opcoes">
                    <a href="inicio.html">Inicio</a>
                    <a href="addItem.html" style="border-bottom: 1px solid #073c05;">Adicionar item</a>
                    <a href="excluiItem.html">Excluir item</a>
                    <a href="alteraItem.html">alterar item</a>
                    <a href="relatorio.html">Relatório de venda</a>
                </div>
            </div>
        </div>
    </header>

    <div class="conteudo">
        <form method="post" action="adicionarProduto">
            <h1 class="titleConteudo">Adicione seu&nbsp;<span class="titleConteudoColor">produto</span></h1>

            <div class="ladoAlado">
                <div class="coluna nome">
                    <label>Nome do produto</label>
                    <div class="input-with-icon">
                        <input type="text" name="nome" id="nome" placeholder="Digite o nome do produto">
                        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 7l9-4 9 4v10l-9 4-9-4V7z" />
                            <path d="M3 7l9 4 9-4" />
                            <path d="M12 3v18" />
                        </svg>
                    </div>
                </div>

                <div class="coluna descricao">
                    <label>Descrição do produto</label>
                    <div class="input-with-icon">
                        <input type="text" name="descricao" placeholder="Digite a descrição do produto">
                        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <path d="M14 2v6h6" />
                            <path d="M8 12h8" />
                            <path d="M8 16h8" />
                        </svg>
                    </div>
                </div>
            </div>

            <div class="ladoAlado">
                <div class="coluna valor">
                    <label>Valor do produto</label>
                    <div class="input-with-icon">
                        <input type="text" name="valor" placeholder="R$ 00,00">
                        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 1v22" />
                            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7H15a3.5 3.5 0 0 1 0 7H6" />
                        </svg>
                    </div>
                </div>

                <div class="coluna codigo">
                    <label>Código de barras do produto</label>
                    <div class="input-with-icon">
                        <input type="text" name="codigoBarras" placeholder="Digite o código de barras do produto">
                        <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000"
                            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="4" width="20" height="16" rx="1" />
                            <path d="M6 8v8" />
                            <path d="M9 6v12" />
                            <path d="M12 8v8" />
                            <path d="M15 6v12" />
                            <path d="M18 8v8" />
                        </svg>
                    </div>
                </div>
            </div>

            <div class="ladoAlado">
                <div class="coluna img"><label class="add-img-label" for="foto">
                        Add imagem
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" />
                            <circle cx="8.5" cy="8.5" r="1.5" />
                            <path d="M21 15l-5-6-7 8" />
                        </svg>
                    </label>

                    <input type="file" id="foto" accept="image/*">

                </div>
                <div class="coluna vazia"></div>
            </div>

            <img id="preview" style="display:none; max-width:180px; margin-top:10px; border-radius:8px;">

            <div class="botoes">
                <button class="btn cancelar">Cancelar</button>
                <button class="btn adicionar">Adicionar</button>
            </div>
        </form>
    </div>


    <script>
        const input = document.getElementById('foto');
        const preview = document.getElementById('preview');

        input.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>

</html>
